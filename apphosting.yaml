# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure
# Public Sanity config is needed during Next.js build for sitemap/blog data.
env:
  - variable: NEXT_PUBLIC_SANITY_PROJECT_ID
    value: h6ymmj0v
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SANITY_DATASET
    value: production
    availability:
      - BUILD
      - RUNTIME

  - variable: TELEGRAM_BOT_TOKEN
    secret: TELEGRAM_BOT_TOKEN
  - variable: TELEGRAM_CHAT_ID
    secret: TELEGRAM_CHAT_ID
  - variable: TELEGRAM_MESSAGE_THREAD_ID
    secret: TELEGRAM_MESSAGE_THREAD_ID

  - variable: AMOCRM_DOMAIN
    secret: AMOCRM_DOMAIN
  - variable: AMOCRM_SUBDOMAIN
    secret: AMOCRM_SUBDOMAIN
  - variable: AMOCRM_ACCESS_TOKEN
    secret: AMOCRM_ACCESS_TOKEN

  - variable: N8N_WEBHOOK_URL
    secret: N8N_WEBHOOK_URL

# Using the Node.js runtime buildpack
run:
  command: npm start
  env:
    - name: PORT
      value: "8080"
build:
  runtime: nodejs20
